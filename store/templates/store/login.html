{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm border-0">
            <h2 class="mb-4 text-center fw-bold text-dark">Iniciar Sesión</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-secondary">Nombre de usuario</label>
                    <input type="text" name="username" id="username" class="form-control py-2" placeholder="Tu usuario" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-secondary">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control py-2" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 mt-3 fw-bold">Ingresar a la plataforma</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'register' %}" class="small text-decoration-none text-primary">¿No tienes cuenta? Regístrate aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
