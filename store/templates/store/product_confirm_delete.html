{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <div class="card p-4 shadow-sm border-danger">
            <h3 class="mb-4">¿Estás seguro de eliminar "{{ product.name }}"?</h3>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="POST">
                {% csrf_token %}
                <button class="btn btn-danger w-100 mb-2">Sí, eliminar definitivamente</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
